<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duo Quiz</title>
  <meta name="description" content="Le jeu à deux pour mieux se connaître : répondez, devinez, comparez.">
  <meta name="theme-color" content="#160a2b">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Duo Quiz">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">

<body>
  <div class="shell">
    <header class="topbar">
      <span class="brand">Duo Quiz</span>

    <nav id="tabs" class="tabbar" aria-label="Navigation principale" hidden></nav>
